egularities (called exceptions\") in CPU operation."], ["C", "All interrupts are treated equally by the CPU; if two arrive at the same time then the CPU arbitrarily chooses one to execute first."], ["D", "Because of their importance no interrupt can ever be disabled by the programmer."], ["E", "Interrupts can be assigned different priority levels; usually a high priority one can take over from one of low priority."]], "a": "ABE", "c": 0}, {"q": "Many data acquisition applications need to digitise more than one input signal. A common ADC system configuration therefore contains three sub-systems. Identify the correct statements.", "o": [["A", "Each analog input has a sample and hold, the multiplexer makes its selection from the outputs of these."], ["B", "Because the ADC itself is complex and space-hungry on the chip, only one ADC is generally used."], ["C", "The multiplexer selects whichever input the controlling program requires, this is then converted by the ADC."], ["D", "Using a multiplexer with the ADC input has the added benefit of speeding up the conversion rate for any given input."], ["E", "The sample and hold \"takes a snapshot\" of the signal to be converted, so the ADC is not trying to convert a changing voltage."]], "a": "BCE", "c": 0}, {"q": "A digital to analog converter (DAC) is almost always formed using an \"R-2R\" ladder. Identify the correct statements:", "o": [["A", "The R-2R ladder configuration is favoured because it uses only 2 resistor values, so it's comparatively easy to fabricate."], ["B", "The R-2R ladder is made of a series of resistors, it derives its name because, moving up the ladder, each resistor is twice the value of its neighbor."], ["C", "A DAC outputs a voltage which is proportional to the input (digital) number."], ["D", "The DAC output is not continuous, it can only take on a fixed number of output values (one for each input value)."]], "a": "ACD", "c": 0}, {"q": "A machine controlled by a microcontroller has a number of switc
